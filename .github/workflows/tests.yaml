name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest -q --disable-socket --allow-unix-socket
      - run: >-
          ruff check custom_components/rinnai_smart/filters.py
          custom_components/rinnai_smart/config_flow.py
          custom_components/rinnai_smart/__init__.py tests
